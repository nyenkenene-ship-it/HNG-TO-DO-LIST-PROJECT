<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HNG TO-DO TASK LIST PROJECT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f7fb;
  color: #172033;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.topbar {
  height: 68px;
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand {
  font-size: 21px;
  font-weight: 800;
  color: #111827;
}

.brand span {
  color: #4f46e5;
}

.public-badge {
  font-size: 12px;
  background: #eef2ff;
  color: #4338ca;
  padding: 6px 10px;
  border-radius: 20px;
  margin-left: 10px;
}

.layout {
  display: flex;
  min-height: calc(100vh - 68px);
}

.sidebar {
  width: 245px;
  background: #ffffff;
  border-right: 1px solid #e5e7eb;
  padding: 22px 15px;
}

.sidebar-title {
  font-size: 12px;
  font-weight: 700;
  color: #6b7280;
  text-transform: uppercase;
  margin: 18px 10px 8px;
}

.navbtn,
.project-btn {
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  padding: 10px 12px;
  border-radius: 8px;
  margin-bottom: 3px;
  color: #374151;
}

.navbtn:hover,
.project-btn:hover {
  background: #f3f4f6;
}

.navbtn.active {
  background: #eef2ff;
  color: #4338ca;
  font-weight: 700;
}

.main {
  flex: 1;
  padding: 30px;
  max-width: 1400px;
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 25px;
}

.page-header h1 {
  margin: 0;
  font-size: 28px;
}

.muted {
  color: #6b7280;
  font-size: 14px;
}

.btn {
  border: 0;
  border-radius: 8px;
  padding: 10px 15px;
  font-weight: 600;
}

.btn.primary {
  background: #4f46e5;
  color: white;
}

.btn.primary:hover {
  background: #4338ca;
}

.btn.secondary {
  background: #eef2f7;
  color: #374151;
}

.btn.danger {
  background: #fee2e2;
  color: #991b1b;
}

.stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
  margin-bottom: 25px;
}

.stat-card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 18px;
}

.stat-card h3 {
  margin: 0 0 8px;
  font-size: 13px;
  color: #6b7280;
}

.stat-card strong {
  font-size: 25px;
}

.task-card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 16px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  margin-bottom: 10px;
}

.task-card.completed {
  opacity: .65;
}

.task-card.completed .task-title {
  text-decoration: line-through;
}

.task-check input {
  width: 19px;
  height: 19px;
  margin-top: 3px;
}

.task-main {
  flex: 1;
}

.task-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 6px;
}

.task-notes {
  color: #6b7280;
  font-size: 14px;
  margin-bottom: 8px;
}

.task-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 12px;
  color: #6b7280;
}

.priority,
.project-tag {
  padding: 4px 7px;
  border-radius: 5px;
  background: #f3f4f6;
}

.priority.high {
  background: #fee2e2;
  color: #991b1b;
}

.priority.medium {
  background: #fef3c7;
  color: #92400e;
}

.priority.low {
  background: #dcfce7;
  color: #166534;
}

.task-actions {
  display: flex;
  gap: 7px;
}

.empty {
  background: white;
  border: 1px dashed #d1d5db;
  border-radius: 12px;
  padding: 50px 20px;
  text-align: center;
  color: #6b7280;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .5);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 50;
}

.modal-card {
  width: min(600px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 14px;
  padding: 25px;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.modal-header h2 {
  margin: 0;
}

.close {
  border: 0;
  background: transparent;
  font-size: 25px;
}

.field {
  margin-bottom: 15px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  padding: 10px;
  background: white;
}

.field textarea {
  min-height: 100px;
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

.error {
  background: #fee2e2;
  color: #991b1b;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 15px;
  font-size: 14px;
}

.toast {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: #111827;
  color: white;
  padding: 12px 18px;
  border-radius: 8px;
  z-index: 100;
}

.calendar-day {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

.calendar-day h3 {
  margin-top: 0;
}

.analytics-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

@media (max-width: 900px) {
  .sidebar {
    width: 200px;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .analytics-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 650px) {
  .layout {
    display: block;
  }

  .sidebar {
    width: 100%;
    border-right: 0;
    border-bottom: 1px solid #e5e7eb;
  }

  .main {
    padding: 18px;
  }

  .topbar {
    padding: 0 15px;
  }

  .page-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .task-card {
    flex-direction: column;
  }

  .task-actions {
    width: 100%;
  }

  .form-row {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div>
    <span class="brand">
      HNG TO-DO TASK LIST PROJECT
    </span>
    <span class="public-badge">
      Public Workspace
    </span>
  </div>

  <button class="btn primary" id="newTask">
    + New Task
  </button>
</header>

<div class="layout">

  <aside class="sidebar">

    <div class="sidebar-title">Tasks</div>

    <button class="navbtn active" data-view="all">
      All Tasks
      <span id="countAll"></span>
    </button>

    <button class="navbtn" data-view="today">
      Today
      <span id="countToday"></span>
    </button>

    <button class="navbtn" data-view="upcoming">
      Upcoming
      <span id="countUpcoming"></span>
    </button>

    <button class="navbtn" data-view="completed">
      Completed
      <span id="countCompleted"></span>
    </button>

    <button class="navbtn" data-view="overdue">
      Overdue
      <span id="countOverdue"></span>
    </button>

    <div class="sidebar-title">Workspace</div>

    <button class="navbtn" data-view="calendar">
      Calendar
    </button>

    <button class="navbtn" data-view="analytics">
      Analytics
    </button>

    <div class="sidebar-title">Projects</div>

    <div id="projectsList"></div>

    <button class="btn secondary" id="newProject" style="width:100%;margin-top:8px;">
      + New Project
    </button>

  </aside>

  <main class="main">

    <div class="page-header">
      <div>
        <h1>HNG TO-DO TASK LIST</h1>
        <p class="muted">
          A simple shared productivity workspace for everyone.
        </p>
      </div>

      <button class="btn primary" onclick="exportCSV()">
        Export CSV
      </button>
    </div>

    <div class="stats">

      <div class="stat-card">
        <h3>Total Tasks</h3>
        <strong id="statTotal">0</strong>
      </div>

      <div class="stat-card">
        <h3>Today</h3>
        <strong id="statToday">0</strong>
      </div>

      <div class="stat-card">
        <h3>Upcoming</h3>
        <strong id="statUpcoming">0</strong>
      </div>

      <div class="stat-card">
        <h3>Completed</h3>
        <strong id="statCompleted">0</strong>
      </div>

      <div class="stat-card">
        <h3>Overdue</h3>
        <strong id="statOverdue">0</strong>
      </div>

    </div>

    <div id="taskSection">

      <div id="taskList"></div>

    </div>

    <div id="calendarView" class="hidden"></div>

    <div id="analyticsView" class="hidden"></div>

  </main>

</div>


<!-- TASK MODAL -->

<div id="taskModal" class="modal hidden">

  <div class="modal-card">

    <div class="modal-header">

      <h2>Task</h2>

      <button class="close" id="closeTask">
        ×
      </button>

    </div>

    <div id="taskError" class="error hidden"></div>

    <div class="field">
      <label>Task Title</label>
      <input id="fTitle" type="text" placeholder="Enter task title">
    </div>

    <div class="form-row">

      <div class="field">
        <label>Priority</label>

        <select id="fPriority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <div class="field">
        <label>Project</label>
        <select id="fProject"></select>
      </div>

    </div>

    <div class="form-row">

      <div class="field">
        <label>Due Date</label>
        <input id="fDate" type="date">
      </div>

      <div class="field">
        <label>Due Time</label>
        <input id="fTime" type="time">
      </div>

    </div>

    <div class="field">
      <label>Recurring</label>

      <select id="fRecurring">
        <option value="none">None</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
    </div>

    <div class="field">
      <label>Notes</label>
      <textarea id="fNotes" placeholder="Additional notes"></textarea>
    </div>

    <div class="modal-actions">

      <button class="btn secondary" id="closeTask2">
        Cancel
      </button>

      <button class="btn primary" id="saveTask">
        Save Task
      </button>

    </div>

  </div>

</div>


<!-- PROJECT MODAL -->

<div id="projectModal" class="modal hidden">

  <div class="modal-card">

    <div class="modal-header">

      <h2>New Project</h2>

      <button class="close" id="closeProject">
        ×
      </button>

    </div>

    <div class="field">

      <label>Project Name</label>

      <input
        id="projectName"
        type="text"
        placeholder="Project name"
      >

    </div>

    <div class="field">

      <label>Project Color</label>

      <input
        id="projectColor"
        type="color"
        value="#4f46e5"
      >

    </div>

    <div class="modal-actions">

      <button class="btn secondary" id="closeProject2">
        Cancel
      </button>

      <button class="btn primary" id="saveProject">
        Create Project
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast hidden"></div>


<script>

const cfg = window.TASKFLOW_CONFIG || {};

let sb = null;
let tasks = [];
let projects = [];
let view = 'all';
let editing = null;

const $ = id => document.getElementById(id);

const today = () =>
  new Date().toISOString().slice(0, 10);

const esc = value =>
  String(value ?? '').replace(/[&<>'"]/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    "'": '&#39;',
    '"': '&quot;'
  }[char]));

function fmt(date) {

  if (!date) return '';

  const d =
    new Date(`${date}T00:00:00`);

  return d.toLocaleDateString(undefined, {
    month: 'short',
    day: 'numeric',
    year: 'numeric'
  });
}

function overdue(task) {

  return (
    !task.completed &&
    task.due_date &&
    task.due_date < today()
  );
}

function toast(message) {

  const el = $('toast');

  if (!el) return;

  el.textContent = message;

  el.classList.remove('hidden');

  setTimeout(() => {
    el.classList.add('hidden');
  }, 2500);
}

function showError(message) {

  const el = $('taskError');

  if (!el) return;

  el.textContent = message;

  el.classList.remove('hidden');
}

function hideError() {

  const el = $('taskError');

  if (el) {
    el.classList.add('hidden');
  }
}


/* DATABASE */

async function init() {

  if (
    !cfg.SUPABASE_URL ||
    !cfg.SUPABASE_ANON_KEY
  ) {

    toast(
      'Supabase configuration is missing.'
    );

    return;
  }

  sb = window.supabase.createClient(
    cfg.SUPABASE_URL,
    cfg.SUPABASE_ANON_KEY
  );

  await loadProjects();

  await loadTasks();
}


/* PROJECTS */

async function loadProjects() {

  const result =
    await sb
      .from('projects')
      .select('*')
      .order('name');

  if (result.error) {

    console.error(result.error);

    toast(result.error.message);

    return;
  }

  projects = result.data || [];

  renderProjects();

  fillProjects();
}

function renderProjects() {

  const container =
    $('projectsList');

  if (!container) return;

  container.innerHTML =
    projects.map(project => `

      <button
        class="project-btn"
        onclick="projectView('${project.id}')"
      >

        <span
          style="
            display:inline-block;
            width:9px;
            height:9px;
            border-radius:50%;
            background:${esc(project.color || '#4f46e5')};
            margin-right:6px;
          "
        ></span>

        ${esc(project.name)}

      </button>

    `).join('');
}

function fillProjects() {

  const select =
    $('fProject');

  if (!select) return;

  select.innerHTML = `

    <option value="">
      No project
    </option>

    ${projects.map(project => `
      <option value="${project.id}">
        ${esc(project.name)}
      </option>
    `).join('')}

  `;
}

window.projectView = id => {

  view = `project:${id}`;

  document
    .querySelectorAll('.navbtn')
    .forEach(button =>
      button.classList.remove('active')
    );

  render();
};


/* TASKS */

async function loadTasks() {

  const result =
    await sb
      .from('tasks')
      .select('*,projects(id,name,color)')
      .order('created_at', {
        ascending: false
      });

  if (result.error) {

    console.error(result.error);

    toast(result.error.message);

    return;
  }

  tasks = result.data || [];

  render();
}


/* FILTER */

function filteredTasks() {

  if (view === 'today') {

    return tasks.filter(
      task => task.due_date === today()
    );
  }

  if (view === 'upcoming') {

    return tasks.filter(
      task =>
        !task.completed &&
        task.due_date &&
        task.due_date > today()
    );
  }

  if (view === 'completed') {

    return tasks.filter(
      task => task.completed
    );
  }

  if (view === 'overdue') {

    return tasks.filter(
      task => overdue(task)
    );
  }

  if (view.startsWith('project:')) {

    const projectId =
      view.split(':')[1];

    return tasks.filter(
      task =>
        task.project_id === projectId
    );
  }

  return tasks;
}


/* TASK CARD */

function taskCard(task) {

  return `

    <div class="task-card
      ${task.completed ? 'completed' : ''}">

      <div class="task-check">

        <input
          type="checkbox"
          ${task.completed ? 'checked' : ''}
          onchange="
            toggleTask(
              '${task.id}',
              this.checked
            )
          "
        >

      </div>

      <div class="task-main">

        <div class="task-title">
          ${esc(task.title)}
        </div>

        ${
          task.notes
            ? `
              <div class="task-notes">
                ${esc(task.notes)}
              </div>
            `
            : ''
        }

        <div class="task-meta">

          <span
            class="priority ${esc(task.priority)}"
          >
            ${esc(task.priority)}
          </span>

          ${
            task.projects
              ? `
                <span class="project-tag">
                  ${esc(task.projects.name)}
                </span>
              `
              : ''
          }

          ${
            task.due_date
              ? `
                <span>
                  📅 ${fmt(task.due_date)}
                  ${
                    task.due_time
                      ? ' ' + esc(task.due_time)
                      : ''
                  }
                </span>
              `
              : ''
          }

          ${
            task.recurring !== 'none'
              ? `
                <span>
                  🔄 ${esc(task.recurring)}
                </span>
              `
              : ''
          }

        </div>

      </div>

      <div class="task-actions">

        <button
          class="btn secondary"
          onclick="
            editTask('${task.id}')
          "
        >
          Edit
        </button>

        <button
          class="btn danger"
          onclick="
            deleteTask('${task.id}')
          "
        >
          Delete
        </button>

      </div>

    </div>

  `;
}


/* RENDER */

function render() {

  const taskSection =
    $('taskSection');

  const calendar =
    $('calendarView');

  const analytics =
    $('analyticsView');

  taskSection.classList.remove('hidden');

  calendar.classList.add('hidden');

  analytics.classList.add('hidden');

  if (view === 'calendar') {

    taskSection.classList.add('hidden');

    calendar.classList.remove('hidden');

    renderCalendar();

    return;
  }

  if (view === 'analytics') {

    taskSection.classList.add('hidden');

    analytics.classList.remove('hidden');

    renderAnalytics();

    return;
  }

  renderTaskList();

  updateStats();
}

function renderTaskList() {

  const container =
    $('taskList');

  const list =
    filteredTasks();

  if (!list.length) {

    container.innerHTML = `

      <div class="empty">

        <h3>No tasks here</h3>

        <p>
          Create a new task to get started.
        </p>

      </div>

    `;

    return;
  }

  container.innerHTML =
    list.map(taskCard).join('');
}

function updateStats() {

  $('statTotal').textContent =
    tasks.length;

  $('statToday').textContent =
    tasks.filter(
      task => task.due_date === today()
    ).length;

  $('statUpcoming').textContent =
    tasks.filter(
      task =>
        !task.completed &&
        task.due_date &&
        task.due_date > today()
    ).length;

  $('statCompleted').textContent =
    tasks.filter(
      task => task.completed
    ).length;

  $('statOverdue').textContent =
    tasks.filter(
      task => overdue(task)
    ).length;

  $('countAll').textContent =
    tasks.length;

  $('countToday').textContent =
    tasks.filter(
      task => task.due_date === today()
    ).length;

  $('countUpcoming').textContent =
    tasks.filter(
      task =>
        !task.completed &&
        task.due_date &&
        task.due_date > today()
    ).length;

  $('countCompleted').textContent =
    tasks.filter(
      task => task.completed
    ).length;

  $('countOverdue').textContent =
    tasks.filter(
      task => overdue(task)
    ).length;
}


/* NAVIGATION */

document
  .querySelectorAll('.navbtn[data-view]')
  .forEach(button => {

    button.onclick = () => {

      document
        .querySelectorAll('.navbtn')
        .forEach(item =>
          item.classList.remove('active')
        );

      button.classList.add('active');

      view =
        button.dataset.view;

      render();
    };

  });


/* CALENDAR */

function renderCalendar() {

  const container =
    $('calendarView');

  const grouped = {};

  tasks.forEach(task => {

    if (!task.due_date) return;

    if (!grouped[task.due_date]) {
      grouped[task.due_date] = [];
    }

    grouped[task.due_date].push(task);
  });

  const dates =
    Object.keys(grouped).sort();

  if (!dates.length) {

    container.innerHTML = `

      <div class="empty">

        <h3>No scheduled tasks</h3>

        <p>
          Add due dates to your tasks
          to see them here.
        </p>

      </div>

    `;

    return;
  }

  container.innerHTML =
    dates.map(date => `

      <div class="calendar-day">

        <h3>${fmt(date)}</h3>

        ${grouped[date]
          .map(taskCard)
          .join('')}

      </div>

    `).join('');
}


/* ANALYTICS */

function renderAnalytics() {

  const total =
    tasks.length;

  const completed =
    tasks.filter(
      task => task.completed
    ).length;

  const pending =
    total - completed;

  const overdueCount =
    tasks.filter(
      task => overdue(task)
    ).length;

  $('analyticsView').innerHTML = `

    <div class="analytics-grid">

      <div class="stat-card">
        <h3>Total Tasks</h3>
        <strong>${total}</strong>
      </div>

      <div class="stat-card">
        <h3>Completed</h3>
        <strong>${completed}</strong>
      </div>

      <div class="stat-card">
        <h3>Pending</h3>
        <strong>${pending}</strong>
      </div>

      <div class="stat-card">
        <h3>Overdue</h3>
        <strong>${overdueCount}</strong>
      </div>

    </div>

  `;
}


/* TASK MODAL */

function openTask(id = null) {

  editing = id;

  hideError();

  if (id) {

    const task =
      tasks.find(item => item.id === id);

    if (!task) return;

    $('fTitle').value =
      task.title || '';

    $('fPriority').value =
      task.priority || 'medium';

    $('fProject').value =
      task.project_id || '';

    $('fDate').value =
      task.due_date || '';

    $('fTime').value =
      task.due_time || '';

    $('fRecurring').value =
      task.recurring || 'none';

    $('fNotes').value =
      task.notes || '';

  } else {

    $('fTitle').value = '';

    $('fPriority').value =
      'medium';

    $('fProject').value = '';

    $('fDate').value = '';

    $('fTime').value = '';

    $('fRecurring').value =
      'none';

    $('fNotes').value = '';
  }

  $('taskModal')
    .classList.remove('hidden');
}

function closeTask() {

  $('taskModal')
    .classList.add('hidden');

  editing = null;
}


/* SAVE TASK */

async function saveTask() {

  hideError();

  const title =
    $('fTitle').value.trim();

  if (!title) {

    showError(
      'Task title is required.'
    );

    return;
  }

  const payload = {

    title,

    priority:
      $('fPriority').value,

    project_id:
      $('fProject').value || null,

    due_date:
      $('fDate').value || null,

    due_time:
      $('fTime').value || null,

    recurring:
      $('fRecurring').value,

    notes:
      $('fNotes').value.trim(),

    user_id: null

  };

  let result;

  if (editing) {

    result =
      await sb
        .from('tasks')
        .update(payload)
        .eq('id', editing);

  } else {

    result =
      await sb
        .from('tasks')
        .insert(payload);
  }

  if (result.error) {

    showError(
      result.error.message
    );

    return;
  }

  closeTask();

  await loadTasks();

  toast(
    editing
      ? 'Task updated'
      : 'Task created'
  );
}


/* COMPLETE TASK */

window.toggleTask =
async function(id, checked) {

  const result =
    await sb
      .from('tasks')
      .update({
        completed: checked,
        completed_at:
          checked
            ? new Date().toISOString()
            : null
      })
      .eq('id', id);

  if (result.error) {

    toast(
      result.error.message
    );

    return;
  }

  await loadTasks();
};


/* EDIT */

window.editTask =
function(id) {

  openTask(id);
};


/* DELETE */

window.deleteTask =
async function(id) {

  if (!confirm(
    'Delete this task?'
  )) {
    return;
  }

  const result =
    await sb
      .from('tasks')
      .delete()
      .eq('id', id);

  if (result.error) {

    toast(
      result.error.message
    );

    return;
  }

  await loadTasks();

  toast('Task deleted');
};


/* EXPORT */

window.exportCSV =
function() {

  const headers = [
    'Title',
    'Priority',
    'Project',
    'Due Date',
    'Due Time',
    'Completed',
    'Recurring',
    'Notes'
  ];

  const rows =
    tasks.map(task => [

      task.title,

      task.priority,

      task.projects?.name || '',

      task.due_date || '',

      task.due_time || '',

      task.completed
        ? 'Yes'
        : 'No',

      task.recurring || '',

      task.notes || ''

    ]);

  const csv = [
    headers,
    ...rows
  ]
    .map(row =>
      row
        .map(value =>
          `"${String(value)
            .replace(/"/g, '""')}"`
        )
        .join(',')
    )
    .join('\n');

  const blob =
    new Blob(
      [csv],
      {
        type:
          'text/csv;charset=utf-8;'
      }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement('a');

  link.href = url;

  link.download =
    'HNG-To-Do-Tasks.csv';

  document.body.appendChild(link);

  link.click();

  link.remove();

  URL.revokeObjectURL(url);
};


/* PROJECT */

$('saveProject').onclick =
async function() {

  const name =
    $('projectName')
      .value
      .trim();

  if (!name) return;

  const result =
    await sb
      .from('projects')
      .insert({
        name,
        color:
          $('projectColor').value,
        user_id: null
      });

  if (result.error) {

    toast(
      result.error.message
    );

    return;
  }

  $('projectModal')
    .classList.add('hidden');

  $('projectName').value = '';

  await loadProjects();

  toast('Project created');
};


/* MODALS */

$('newTask').onclick =
function() {
  openTask();
};

$('closeTask').onclick =
closeTask;

$('closeTask2').onclick =
closeTask;

$('newProject').onclick =
function() {

  $('projectModal')
    .classList.remove('hidden');
};

$('closeProject').onclick =
function() {

  $('projectModal')
    .classList.add('hidden');
};

$('closeProject2').onclick =
function() {

  $('projectModal')
    .classList.add('hidden');
};

$('saveTask').onclick =
saveTask;


/* START */

init();

</script>
